# Local Foundry VTT v14 for module development.
#
# Runs the official Foundry Node.js build (unzipped into dev/foundryvtt/, not committed) on a digest-pinned
# Node 24 image — nothing is installed from npm. The container joins Warden's network so Traefik serves it at
# https://ten-candles.test with Warden's root CA, reachable from the host browser and the playwright-mcp container.
#
#   warden sign-certificate ten-candles.test   # once
#   docker compose up -d
#
# Only run while nobody is playing on Forge with the same licence.
name: ten-candles

services:
  foundry:
    image: node:24-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    user: node
    working_dir: /opt/foundryvtt
    command: ["node", "main.js", "--dataPath=/data", "--port=30000", "--noupnp"]
    restart: unless-stopped
    volumes:
      - ./dev/foundryvtt:/opt/foundryvtt:ro
      - ./dev/foundry-data:/data
      - ./module:/data/Data/modules/ten-candles-foundry
    networks:
      - warden
    labels:
      traefik.enable: "true"
      traefik.docker.network: warden
      traefik.http.routers.ten-candles.rule: Host(`ten-candles.test`)
      traefik.http.routers.ten-candles.tls: "true"
      traefik.http.services.ten-candles.loadbalancer.server.port: "30000"

networks:
  warden:
    external: true
