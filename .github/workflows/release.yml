# Tag vX.Y.Z → GitHub release with module.zip and module.json, so Forge can install from
# https://github.com/Vinai/ten-candles-foundry/releases/latest/download/module.json
# Only the first-party checkout action (pinned by SHA) and the preinstalled gh/jq/zip are used.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Stamp version and download URL into module.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" \
             --arg d "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.zip" \
             '.version = $v | .download = $d' module/module.json > module.json.tmp
          mv module.json.tmp module/module.json

      - name: Build module.zip
        run: cd module && zip -r ../module.zip . -x '.*'

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" module.zip module/module.json --title "$GITHUB_REF_NAME" --generate-notes
